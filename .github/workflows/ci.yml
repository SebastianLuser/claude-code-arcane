name: CI

on:
  push:
    # Both prefixes are in use (PRs #1-#4 and #6 came from feat/*, #5 and #7
    # from feature/*). Dropping either one costs no error, just a branch that
    # pushes green until the PR is opened.
    branches: [main, feat/*, feature/*]
  pull_request:
    branches: [main]

# Supersede a branch's own in-flight run when you push again, so three pushes in
# a row leave one running suite instead of three.
#
# The group deliberately includes the event name. Grouping only by branch does
# collapse the push and pull_request runs of a branch with an open PR into one,
# which sounds better and measured worse: the cancelled run reports its jobs as
# FAILED on the pull request, so the PR goes red while the surviving run is
# green. A duplicated run costs a minute of CI; a red PR costs the merge signal.
#
# main never cancels: there, a cancelled run leaves a commit with no verdict.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - run: npm test

  lint-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Both locations: hooks/ is the shared lifecycle set, and skills/*/hooks/
      # holds the ones scoped to a single skill (see docs/coding-standards.md).
      # A skill-scoped hook is still a hook and breaks the same way.
      - name: Syntax check all bash hooks
        run: |
          for f in hooks/*.sh skills/*/hooks/*.sh; do
            [ -e "$f" ] || continue
            echo "Checking $f..."
            bash -n "$f"
          done

  # Skill scripts are Python stdlib-only (docs/coding-standards.md), so they are
  # tested here rather than in the Node matrix. compileall is a syntax gate over
  # every shipped script; the specs cover the job-scrape parsers and run on the
  # oldest and newest Python we support.
  skill-scripts:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile every skill script
        run: python -m compileall -q skills
      - name: Run skill script specs
        run: python -m unittest discover -s tests -p "test_*.py"

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npx tsc --noEmit
