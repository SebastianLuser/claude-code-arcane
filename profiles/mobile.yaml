# Bridge for CLIs released before this profile was renamed: they look it up as 'mobile'. Keep identical to mobile-react-native.yaml.
name: mobile
renamed_to: mobile-react-native
description: "Mobile React Native + Expo + TypeScript"
category: mobile

skills:
  - testing
  - i18n-setup
  - deps-audit
  - env-sync
  - observability
  - release
  - onboard
  - perf-profile
  - scaffold-react-native
  - react-native-dev
  - state-management
  - form-validation
  - accessibility
  - auth-strategy
  - file-uploads
  - ci-cd-setup
  - deploy-check
  - firebase

rules:
  universal:
    - frontend-code
  gamedev:
    []

agents:
  - engineering

permissions:
  allow:
    - "Bash(npm *)"
    - "Bash(yarn *)"
    - "Bash(pnpm *)"
  deny:
    []
