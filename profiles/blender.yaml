name: blender
description: "Blender for game assets — modeling with tri and topology budgets, materials/textures with bake and color space, rigging and baked animation, and validated export to Unity/UE5/web with a stdlib glTF validator"
category: gamedev

skills:
  # Foundation — every other blender-* depends on this one
  - blender-context
  # The three production axes
  - blender-modeling
  - blender-materials
  - blender-animation
  # Output: closes the pipeline towards the engine
  - blender-export
  # Reused from the shared library: asset-spec opens the pipeline, asset-audit closes it
  - asset-spec
  - asset-audit

rules:
  universal:
    - blender-pipeline
    - blender-files
  gamedev:
    []

agents:
  # Blender is installed alongside unity-*, unreal-dev or meshy, which already bring
  # agents/game/. Declaring it here would copy all 30 gamedev agents to whoever
  # installs +blender on its own to work on assets without an engine.
  []

permissions:
  allow:
    # Headless Blender is the profile's default path
    - "Bash(blender --version)"
    - "Bash(blender --background*)"
    - "Bash(blender -b *)"
    # Export validator — stdlib, installs nothing
    - "Bash(python *validate_gltf.py*)"
    - "Bash(python3 *validate_gltf.py*)"
    # glb compression for web, on demand via npx
    - "Bash(npx --yes @gltf-transform/cli*)"
    - "Bash(npx @gltf-transform/cli*)"
    # LFS check before committing binaries
    - "Bash(git check-attr*)"
    - "Bash(git lfs version)"
    - "Glob(assets/3d/**)"
    - "Grep(assets/3d/**)"
  deny:
    # Blender backups do not go into the repo
    - "Write(**/*.blend1)"
    - "Write(**/*.blend2)"
