name: freelance
description: "Freelance — win freelance projects and deliver them: scan of public sources with no API key, with dedup and scoring, marketplace search (Upwork, Workana) via WebSearch, market rate intelligence, client risk screening, platform profile, proposals quoted over a net rate floor, contracts and SOWs, kickoff that checks hours against the quote, hour logging and change orders, a pipeline with acquisition cost and utilization, and 4 fresh-context agents (proposal review, adversarial screener, discovery call, pipeline strategist)"
category: personal

skills:
  # Profile core
  - freelance-hunt
  - freelance-profile
  - fiverr-gig
  - freelance-scan
  - client-screen
  - freelance-proposal
  - freelance-pipeline
  - freelance-kickoff
  - freelance-deliver
  # Shared with +job-hunt (a single source of truth for the professional profile)
  - master-profile
  - portfolio-site
  - cold-outreach
  - job-outcome
  - career-registry
  - content-humanizer
  # Shared with +business and +agile
  - contract-and-proposal-writer
  - estimate

rules:
  universal:
    - freelance-guardrails
    - untrusted-content
  gamedev:
    []

agents:
  - freelance

permissions:
  allow:
    - "Bash(python *import_history.py*)"
    - "Bash(python3 *import_history.py*)"
    - "Bash(python *posting_guard.py*)"
    - "Bash(python3 *posting_guard.py*)"
    - "Bash(python *career_registry.py*)"
    - "Bash(python3 *career_registry.py*)"
    - "Bash(python *migrate_workspace.py*)"
    - "Bash(python3 *migrate_workspace.py*)"
    - "Bash(python *humanize.py*)"
    - "Bash(python3 *humanize.py*)"
    - "Bash(python *detect.py*)"
    - "Bash(python3 *detect.py*)"
    - "Bash(python *freelance_search.py*)"
    - "Bash(python3 *freelance_search.py*)"
  deny:
    []
