name: infra
description: "DevOps/Platform/Ops — deploy, observability, secrets, rollback"
category: platform

skills:
  - observability
  - devcontainers
  - cloudflare
  - cdn-setup
  - observability-ops
  - observability-setup
  - feature-flags
  - terraform-init
  - start-service
  - deploy-staging
  - deploy-check
  - docker-setup
  - distributed-tracing
  - error-tracking
  - logging-setup
  - runbooks
  - rollback-strategy
  - backup-strategy
  - release-announce
  - aws-solution-architect
  - azure-cloud-architect
  - gcp-cloud-architect
  - helm-chart-builder
  - incident-commander
  - incident-response
  - incident
  - git-worktree-manager
  - worktree-isolation
  - worktree-isolation-setup
  - ci-cd-setup
  - slo-sli
  - env-sync

rules:
  universal:
    - infra-code
  gamedev:
    []

agents:
  - devops

permissions:
  allow:
    - "Bash(kubectl get*)"
    - "Bash(kubectl describe*)"
    - "Bash(docker ps*)"
    - "Bash(docker images*)"
  deny:
    []
