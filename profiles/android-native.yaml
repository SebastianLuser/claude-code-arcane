# Bridge for CLIs released before this profile was renamed: they look it up as 'android-native'. Keep identical to mobile-android-kotlin.yaml.
name: android-native
renamed_to: mobile-android-kotlin
description: "Android native — Kotlin + Jetpack Compose + Material Design 3"
category: mobile

skills:
  - testing
  - deps-audit
  - env-sync
  - observability
  - release
  - onboard
  - perf-profile
  - android-native-dev
  - state-management
  - form-validation
  - accessibility
  - auth-strategy
  - ci-cd-setup
  - deploy-check

rules:
  universal:
    []
  gamedev:
    []

agents:
  - engineering

permissions:
  allow:
    - "Bash(./gradlew *)"
    - "Bash(gradle *)"
    - "Bash(adb *)"
  deny:
    []
