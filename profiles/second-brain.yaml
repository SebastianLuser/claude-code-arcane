name: second-brain
description: "Second Brain — Obsidian vault managed with Claude Code: frictionless capture, daily/weekly/monthly reviews, atomic notes and hub files (PARA + Zettelkasten), ranked search, web capture, vault health audit and native Obsidian syntax (markdown, Bases, Canvas)"
category: personal

skills:
  - second-brain
  - brain-dump
  - review-dump
  - review-weekly
  - review-monthly
  - zettel
  - hub-note
  - vault-recall
  - vault-clip
  - vault-audit
  - vault-tidy
  - obsidian-markdown
  - obsidian-bases
  - obsidian-canvas

rules:
  universal:
    - vault-conventions
  gamedev:
    []

agents:
  []

permissions:
  allow:
    - "Bash(python *vault_audit.py*)"
    - "Bash(python3 *vault_audit.py*)"
    - "Bash(python *vault_index.py*)"
    - "Bash(python3 *vault_index.py*)"
    - "Bash(python *migrate_vault.py*)"
    - "Bash(python3 *migrate_vault.py*)"
  deny:
    []
