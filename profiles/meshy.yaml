name: meshy
description: "3D asset production with Meshy AI — credit-gated generation, a single master + cheap derivatives (game FBX, web GLB, blend, print STL) and printability"
category: gamedev

skills:
  # Setup: wires up Meshy's official MCP, does not vendor it
  - meshy-setup
  # Pipeline
  - meshy-generate
  - meshy-derive
  - meshy-print
  # Reused from the shared library: asset-spec opens the pipeline, asset-audit closes it
  - asset-spec
  - asset-audit

rules:
  universal:
    - meshy-assets
    - meshy-files
  gamedev:
    []

agents:
  # Meshy is always installed alongside unity-* or unreal-dev, which already bring
  # agents/game/. Declaring it here would only copy the 30 gamedev agents
  # to someone installing +meshy on its own for 3D printing.
  []

permissions:
  allow:
    # Local derivatives — zero credits
    - "Bash(npx --yes @gltf-transform/cli*)"
    - "Bash(npx @gltf-transform/cli*)"
    - "Bash(npx gltf-transform*)"
    # LFS check before committing binaries
    - "Bash(git check-attr*)"
    - "Bash(git lfs version)"
    - "Glob(assets/3d/**)"
    - "Grep(assets/3d/**)"
  deny:
    # The master is immutable: it only comes in via mcp__meshy__download_model,
    # no editing tool touches it afterwards
    - "Write(assets/3d/*/master.glb)"
    - "Edit(assets/3d/*/master.glb)"
