# Bridge for CLIs released before this profile was renamed: they look it up as 'flutter'. Keep identical to mobile-flutter.yaml.
name: flutter
renamed_to: mobile-flutter
description: "Flutter + Dart cross-platform development"
category: mobile
workflows:
  - code-flow

skills:
  - testing
  - i18n-setup
  - deps-audit
  - env-sync
  - observability
  - release
  - onboard
  - perf-profile
  - flutter-dev
  - state-management
  - form-validation
  - accessibility
  - auth-strategy
  - ci-cd-setup
  - deploy-check
  - firebase

rules:
  universal:
    - frontend-code
  gamedev:
    []

agents:
  - engineering/mobile-lead
  - engineering/flutter-engineer

permissions:
  allow:
    - "Bash(flutter *)"
    - "Bash(dart *)"
    - "Bash(pub *)"
  deny:
    []
