name: unity-dev
description: "Programador Unity — C#, arquitectura, performance, builds"
category: gamedev

skills:
  - test-setup
  - smoke-check
  - perf-profile
  - optimize
  - deps-audit
  - env-sync
  - game-security-audit
  - release-checklist
  - patch-notes
  - onboard
  - install-mcp
  - scaffold-unity
  - unity-game-architecture
  - map-systems
  - game-audit
  - audit-game
  - shader-dev
  - balance-check
  - consistency-check
  - doc-gdd
  - playtest-report
  - bug-report
  - bug-triage
  - architecture-review
  - architecture-decision

rules:
  universal:
    []
  gamedev:
    - gameplay-code
    - engine-code
    - shader-code
    - network-code
    - ui-code
    - ai-code

agents:
  # Programming, production and QA. unity-design brings the design agents.
  - game/ai-programmer
  - game/analytics-engineer
  - game/economy-designer
  - game/gameplay-programmer
  - game/lead-programmer
  - game/live-ops-designer
  - game/network-programmer
  - game/performance-analyst
  - game/producer
  - game/qa-lead
  - game/qa-tester-gamedev
  - game/release-manager
  - game/sound-designer
  - game/technical-artist
  - game/technical-director
  - game/unity-shader-specialist
  - game/unity-specialist
  - quality/security-architect

permissions:
  allow:
    []
  deny:
    []
