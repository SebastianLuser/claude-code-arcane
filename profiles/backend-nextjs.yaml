name: backend-nextjs
description: "Next.js full-stack — App Router, RSC, Server Actions, SEO, AI SDK, performance (64 Vercel rules). Front + back in a single runtime."
category: backend
workflows:
  - code-flow

skills:
  # Next.js-specific (new)
  - nextjs-scaffold
  - nextjs-best-practices
  - seo-nextjs
  - ai-sdk-setup
  - pgvector-search
  # Backend / API (Next is full-stack)
  - api-design
  - database
  - caching-strategy
  - rate-limiting
  # Auth & security
  - auth-strategy
  - jwt-strategy
  - oauth-setup
  - web-security
  - csp-headers
  # Frontend quality
  - accessibility
  - performance
  - playwright-pro
  - vercel-deploy
  - web-animation
  - ui-polish
  - click-path-audit
  # Ops & quality
  - testing
  - deps-audit
  - env-sync
  - observability
  - ci-cd-setup
  - cdn-setup
  - worktree-isolation
  - worktree-isolation-setup

rules:
  universal:
    - nextjs-code
    - react-perf
    - frontend-code
    - backend-code
    - api-code
  gamedev:
    []

agents:
  - engineering/frontend-architect
  - engineering/nextjs-engineer
  - engineering/nextjs-reviewer
  - engineering/e2e-tester

permissions:
  allow:
    - "Bash(npm *)"
    - "Bash(yarn *)"
    - "Bash(pnpm *)"
    - "Bash(npx *)"
    - "Bash(docker ps*)"
    - "Bash(docker images*)"
  deny:
    []
