name: job-hunt
description: "Job Hunt — busqueda laboral end-to-end: perfil maestro, CV ATS, LinkedIn, portfolio, cover letters, outreach a recruiters, scoring de ofertas y prep de entrevistas"
type: addon

skills:
  - job-hunt
  - master-profile
  - cv-tailor
  - cv-ats-export
  - linkedin-optimize
  - portfolio-site
  - job-search
  - job-scrape
  - job-aplicar
  - job-outcome
  - job-upskill
  - cover-letter
  - cold-outreach
  - interview-prep
  - network-map
  - personal-brand

rules:
  universal:
    - drafter-reviewer
  gamedev:
    []

agents:
  []

permissions:
  allow:
    - "Bash(python *cv_export.py*)"
    - "Bash(python3 *cv_export.py*)"
    - "Bash(python *verify_pdf.py*)"
    - "Bash(python3 *verify_pdf.py*)"
    - "Bash(python *network_map.py*)"
    - "Bash(python3 *network_map.py*)"
    - "Bash(node *linkedin-search/cli.ts*)"
    - "Bash(node *getonbrd-search/cli.ts*)"
  deny:
    []
