name: job-hunt
description: "Job Hunt — busqueda laboral end-to-end: perfil maestro, CV ATS con verificacion, scraping de ofertas con dedup, pipeline de postulacion, LinkedIn, portfolio, cover letters, outreach a recruiters, scoring de ofertas, gaps/upskill, prep de entrevistas y 4 agentes de contexto fresco (review de CV, hiring manager, mock interview, diagnostico del embudo)"
category: personal

skills:
  - job-hunt
  - master-profile
  - cv-tailor
  - cv-ats-export
  - linkedin-optimize
  - portfolio-site
  - job-search
  - job-scrape
  - job-aplicar
  - job-outcome
  - career-registry
  - job-upskill
  - cover-letter
  - cold-outreach
  - interview-prep
  - network-map
  - personal-brand
  - linkedin-post
  - linkedin-carousel
  - linkedin-comment
  - linkedin-reply
  - linkedin-inbox
  - content-humanizer

rules:
  universal:
    - drafter-reviewer
    - untrusted-content
  gamedev:
    []

agents:
  - career

permissions:
  allow:
    - "Bash(python *posting_guard.py*)"
    - "Bash(python *job_key.py*)"
    - "Bash(python3 *job_key.py*)"
    - "Bash(python3 *posting_guard.py*)"
    - "Bash(python *career_registry.py*)"
    - "Bash(python3 *career_registry.py*)"
    - "Bash(python *cv_export.py*)"
    - "Bash(python3 *cv_export.py*)"
    - "Bash(python *verify_pdf.py*)"
    - "Bash(python3 *verify_pdf.py*)"
    - "Bash(python *network_map.py*)"
    - "Bash(python3 *network_map.py*)"
    - "Bash(python *linkedin_search.py*)"
    - "Bash(python3 *linkedin_search.py*)"
    - "Bash(python *getonbrd_search.py*)"
    - "Bash(python3 *getonbrd_search.py*)"
    - "Bash(python *humanize.py*)"
    - "Bash(python3 *humanize.py*)"
    - "Bash(python *detect.py*)"
    - "Bash(python3 *detect.py*)"
    - "Bash(python *carousel_pdf.py*)"
    - "Bash(python3 *carousel_pdf.py*)"
  deny:
    []
