name: core
description: "Universal skills, base hooks and rules"
category: core

skills:
  - commit
  - create-pr
  - changelog
  - check
  - quality-review
  - context-prime
  - what-next
  - start
  - fix-issue
  - hotfix
  - brainstorm
  - scope-check
  - reverse-document
  - skill-improve
  - skill-test
  - tech-debt
  - arcane-status
  - arcane-list
  - arcane-add
  - arcane-remove
  - arcane-clean
  - kickoff

rules:
  universal:
    - data-files
    - prototype-code
    - test-standards
    - implementation-workflow
    - code-comments
    - verification
    - agent-delegation
    - git-worktrees
    - user-language
  gamedev:
    []

output_styles:
  - arcane

agents:
  # Every project gets core, and QA agents only help where testing is installed.
  []

hooks:
  - session-start.sh
  - detect-unreal.sh
  - check-update.sh
  - detect-division.sh
  - detect-gaps.sh
  - validate-commit.sh
  - guard.sh
  - validate-skill-change.sh
  - notify.sh
  - pre-compact.sh
  - post-compact.sh
  - session-stop.sh
  - worktree-stop.sh
  - session-watch.sh
  - log-agent.sh
  - log-agent-stop.sh

permissions:
  allow:
    - "Bash(git status*)"
    - "Bash(git diff*)"
    - "Bash(git log*)"
    - "Bash(git branch*)"
    - "Bash(git rev-parse*)"
    - "Bash(ls *)"
    - "Bash(dir *)"
    - "Bash(gh pr *)"
    - "Bash(gh issue *)"
    - "Bash(gh run *)"
    - "Bash(gh repo view*)"
    - "Bash(gh release view*)"
    - "Bash(gh search *)"
    - "Bash(gh auth status*)"
    - "Bash(curl -s*)"
  deny:
    - "Bash(git push --force*)"
    - "Bash(git push -f *)"
    - "Bash(git reset --hard*)"
    - "Bash(git clean -f*)"
    - "Bash(sudo *)"
    - "Bash(chmod 777*)"
    - "Bash(*>.env*)"
    - "Bash(cat *.env*)"
    - "Bash(type *.env*)"
    - "Read(**/.env*)"
    - "Read(**/credentials*)"
    - "Read(**/*.pem)"
    - "Read(**/*.key)"
